name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image (app + tests + dependencies)
        run: docker build -t todo-playwright .

      - name: Run tests in Docker
        run: |
          docker run --rm --init --ipc=host \
            -v ${{ github.workspace }}/allure-results:/app/allure-results \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            -v ${{ github.workspace }}/test-results:/app/test-results \
            todo-playwright

      - name: Fix ownership of results created by Docker
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" allure-results playwright-report test-results || true

      - name: Load report history
        if: always()
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Set up Java (needed by Allure CLI)
        if: always()
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Allure report with history
        if: always()
        run: |
          mkdir -p allure-results
          if [ -d gh-pages/history ]; then cp -r gh-pages/history allure-results/history; fi
          npx --yes -p allure-commandline allure generate allure-results --clean -o allure-report

      - name: Publish report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Upload raw results and Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            allure-results
            playwright-report
            test-results
          retention-days: 14